<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Arquivo Winchester</title>

    <!-- Fonts Google -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">
    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Tektur:wght@400..900&display=swap"
        rel="stylesheet">

    <!-- Links Biblioteca de Icones -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Links Favicon -->
    <link rel="shortcut icon"
        href="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/assets/favicon/img_favicon.png"
        type="image/x-icon">

    <!-- Links CSS -->
    <link rel="stylesheet"
        href="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/components/btn-generic/btn-generic.css">
    <link rel="stylesheet"
        href="register-entity.css">
    <link rel="stylesheet"
        href="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/components/navbar/navbar.css">
    <link rel="stylesheet"
        href="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/components/footer/footer.css">

    <!-- Scripts JavaScript -->
    <script src="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/components/footer/footer.js"
        defer></script>
    <script src="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/components/navbar/navbar.js"
        defer></script>

</head>



<body>

    <app-navbar></app-navbar>


    <main>


        <div class="sidebar-nav">
            <h1>Entidades</h1>

            <a href="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/pages/entity/register-entity/register-entity.html"
                class="nav-link1 btn-generic">Nova Entidade</a>
            <a href="/CursoSenai(MyVersionPage)/ExerciciosExtruturaCurso/09_Desafio_ArquivoWinchester/ArquivoWinchester/pages/entity/list-entity/list-entity.html"
                class="nav-link2 btn-generic">Ver Entidades</a>
        </div>

        <div class="card">
            <h2>Cadastrar Entidade</h2>

            <form class="form">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex: Criatura Noturna">
                </div>

                <div class="form-group">
                    <label for="contramedida">Contramedida</label>
                    <input type="text"
                        id="contramedida"
                        name="contramedida"
                        placeholder="Ex: Barreira Salina...">

                </div>

                <div class="form-group">
                    <label for="nivelRisco">Nível Risco</label>
                    <select id="nivelRisco"
                        name="nivelRisco">
                        <option value="">Selecione...</option>
                        <option value="baixo">Baixo</option>
                        <option value="medio">Médio</option>
                        <option value="alto">Alto</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="imagem">Imagem</label>
                    <a class="btn-selecionar-img"
                        href="#">Selecionar Imagem</a>
                </div>

                <div class="form-group">
                    <label for="sinaisComuns">Sinais Comuns</label>
                    <textarea id="sinaisComuns"
                        name="sinaisComuns"
                        placeholder="Ex: Ruídos, falhas elétricas, temperatura baixa..."></textarea>
                </div>

                <div class="form-group">
                    <button type="submit"
                        class="btn-submit btn-generic">Cadastrar</button>
                </div>

            </form>
        </div>


    </main>

    <app-footer></app-footer>

</body>

</html>
