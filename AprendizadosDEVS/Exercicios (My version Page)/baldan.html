<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Logo Baldan</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">
    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* background: #e0dacc; */
            background: #e6dfce;
            /* background: #FAFAE8; */
        }
        
        main{
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: center;
            marin: 0 auto;
        }

        .logo-container, .logo {
                       transition: 5s;

        }

        .text_baldan {
            display: block;
            color: #000000ab;
            font-family: "Syncopate", sans-serif;
            font-weight: 900;
            font-size: 120px;
            font-style: normal;
            margin-top: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            transition: 5s;
        }

        @media (max-width: 900px) {
            .text_baldan {
                display: none;
            }
        }

        .container001:hover .text_baldan {
            display: block;
            transition: 5s;
            scale: 1;

        }

        .container001 {
            position: fixed;
            display: flex;
            align-items: center;
            flex-direction: row;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            transition: 5s;

        }

        .logo {
            position: relative;
            width: 220px;
            height: 140px;
        }

        /* lado esquerdo */
        .left {
            position: absolute;
            right: 150px;
            top: 50%;
            width: 45px;
            height: 45px;
            border: 15px solid #e30613;
            border-left: none;
            border-bottom: none;
            transform: translateY(-50%) rotate(45deg);
            border-radius: 8px;
            z-index: 5;
        }

        /* estrutura principal */
        .main {
            position: absolute;
            right: 45px;
            top: 50%;
            width: 100px;
            height: 100px;
            border: 16px solid #e30613;
            border-left: none;
            border-bottom: none;
            transform: translateY(-50%) rotate(45deg);
            border-radius: 8px;
        }

        /* bolinha central */
        .dot {
            position: absolute;
            top: 50%;
            left: 120px;
            width: 25px;
            height: 25px;
            background: #e30613;
            border-radius: 50%;
            transform: translate(-50%, -50%);

        }

        .acabamento1 {
            position: absolute;
            right: 95px;
            top: 16px;
            width: 30px;
            height: 30px;
            border: 16px solid #e30613;
            border-left: none;
            border-bottom: none;
            border-top: none;
            transform: translateY(-50%) rotate(45deg);
            border-radius: 8px;

        }

        .acabamento2 {
            position: absolute;
            right: 93px;
            top: 126px;
            width: 30px;
            height: 30px;
            border: 16px solid #e30613;
            border-left: none;
            border-bottom: none;

            border-right: none;
            transform: translateY(-50%) rotate(45deg);
            border-radius: 8px;
        }

        .container_button {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            width: 95%;
            gap: 20px;
            margin: 20px 0 0 0 ;
            padding: 0;
            align-items: center;
            justify-content: space-around;
        }



        .button {

            min-width: 320px;
            height: 40px;
            background: #e30613;
            color: #e6dfce;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-family: Arial, sans-serif;
            border-radius: 5px;
            text-shadow: 1px 1px 2px rgb(0, 0, 0);
            box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.744);
            transition: 0.3s;
        }

        .button:hover {
            scale: 1.05;
            transition: 0.3s;
        }

    </style>
</head>

<body>
    <header>

    </header>
    <main>

        <div class="container_button">
            <a class="button"
                href="http://www.google.com"
                target="_blank"
                rel="noopener noreferrer">Link1
            </a>

            <a class="button"
                href="http://www.google.com"
                target="_blank"
                rel="noopener noreferrer">Link1
            </a>

            <a class="button"
                href="http://www.google.com"
                target="_blank"
                rel="noopener noreferrer">Link1
            </a>
        </div>

        <div class="container001">

            <div class="text_baldan">
                <p>BALDAN</p>
            </div>

            <section class="logo-container">
                <div class="logo">
                    <div class="left"></div>
                    <div class="main"></div>
                    <div class="dot"></div>
                    <div class="acabamento1"></div>
                    <div class="acabamento2"></div>

                </div>
            </section>
        </div>

    </main>
</body>

</html>
